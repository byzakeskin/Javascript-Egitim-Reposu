<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Header</h1>
    <input type="text" id="search-input" placeholder="Aradığınız başlığı yazın...">
    <ul id="post-list"></ul>

    <div id="post-detail"></div>

    <script src="app.js"></script>

    <!-- id="search-input" → document.getElementById ile bu kutuyu yakalayacağım, 
    arama filtreleme buraya yazılan metne göre olacak.
    id="post-list" → gönderi başlıklarının <li> olarak basılacağı boş liste. Başta boş, JS dolduracak.
    id="post-detail" → bir gönderiye tıklanınca gövde + yorumların basılacağı boş kutu olacak.

</body>

</html>
