<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Id ve Class Kullanımı</title>

    <style>
      p {
        color: blue;
        font-size: 30px;
      }

      .red {
        color: red;
        font-size: 20px;
      }

      .yellow {
        color: yellow;
      }

      .f15 {
        font-size: 15px;
      }

      #id {
        color: purple;
        font-size: 40px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <p>Lorem ipsum dolor sit amet.</p>
    <p style="color: green">Lorem ipsum dolor sit amet.</p>
    <p id="id">Lorem ipsum dolor sit amet.</p>
    <p class="red">Lorem ipsum dolor sit amet.</p>
    <p class="f15">Lorem ipsum dolor sit amet.</p>
    <p class="yellow">Lorem ipsum dolor sit amet.</p>
  </body>
</html>
