<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontlar ve Özellikleri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Zen+Dots&display=swap" rel="stylesheet">
</head>
<style>
    body {
        font-size: 10px;
    }

    h2 {
        font-size: 40px;
    }

    p {
        font-size: 2em;
    }

    #font1 {
        font-family: "Lobster", sans-serif;
        font-weight: 400;
        font-style: normal;
    }

    #font2 {
        font-family: "Zen Dots", sans-serif;
        font-weight: 400;
        font-style: normal;
    }
</style>

<body>
    <h2 id="font1">Lorem ipsum dolor sit.</h1>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Eius nulla voluptas eveniet, voluptates debitis
            quod reiciendis, repudiandae est praesentium quidem, inventore ratione sint unde voluptatibus quaerat
            expedita sapiente sed! Itaque.</p>

        <p id="font2">Lorem ipsum dolor sit amet.</p>
</body>

</html>
