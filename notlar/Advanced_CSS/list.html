<html lang="en">
<head>

    <title>Liste Biçimlendirme</title>
</head>
<style>
    ul{
        border:1px solid pink;
        border-radius: 10px;

    <ul>

        <li>Madde 2</li>
        <li>Lorem ipsum dolor sit amet.</li>
