<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link ve Buton Biçimlendirme</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
    a {
        color: mediumaquamarine;
        font-size: 22px;
        margin: 10px;
        text-decoration: none;
    }

    a:hover {
        color: pink;
        background-color: mediumaquamarine;
        text-decoration: none;
        font-size: 24px;
    }

    .buton{
        padding: 10px 20px;
        background-color: darkorange;
        border: none;
        color: wheat;
        border-radius: 50px;
    }

    .buton:hover{
        background-color: brown;
    }

    i{
        color:black;
        margin-right: 5px;
    }
</style>

<body>
    <a href="#">Link 1</a>
    <a href="#">Link 2</a>
    <a href="#">Link 3</a>
    <a href="#">Link 4</a>

    <br><br><br>

    <button class="buton"><i class="fa-solid fa-code"></i>Anasayfa</button>
    <button class="buton">Hakkımızda</button>
    <button class="buton">Kategoriler</button>
    <button class="buton">İletişim</button>
</body>
</body>
</body>
</body>

</html>
