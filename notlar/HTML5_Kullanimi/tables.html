<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç Liste Fiyatları</title>
</head>
<body>
    <table border="2" width="50%">
    <thead>
        <tr>
            <th>Araç Adı</th>
            <th>Fiyatı</th>
            <th>Açıklama</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>X</td>
            <td>100.000$</td>
            <td>Lorem, ipsum.</td>
        </tr>
        <tr>
            <td>Y</td>
            <td>200.000$</td>
            <td rowspan="2">Lorem, ipsum dolor.</td>
        </tr>
        <tr>
            <td>Z</td>
            <td>150.000$</td>

        </tr>

        <tr>
            <td colspan="3">Lorem ipsum dolor sit.</td>
        </tr>
    </tbody>
    </table>

</body>
</html>
