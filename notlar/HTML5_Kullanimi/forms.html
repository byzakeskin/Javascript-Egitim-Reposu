<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formlar</title>
</head>
<body>
    <form>
        <p>
            Ad: <input type="text" name="ad">
        </p>
        <p>
            Soyad: <input type="text" name="soyad">
        </p>
        <p>
            Email: <input type="email" name="email">
        </p>
        <p>
            Parola: <input type="password" name="parola">
        </p>
        <p>Parolayı hatırla <input type="checkbox" name="checkbox"></p>
        <p>
            Cinsiyet:
            <br>
            Erkek: <input type="radio" name="cinsiyet">
            Kadın: <input type="radio" name="cinsiyet">
        </p>
        <p>
            Hobileriniz:<br>
            Kitap Okumak <input type="checkbox" name="hobi">
            Bilgisayar Oyunu Oynamak <input type="checkbox" name="hobi">
            Resim Yapmak <input type="checkbox" name="hobi">
        </p>

        Doğum yeriniz:<br>
        <select name="dogumyeri">
            <option>İstanbul</option>
            <option>Ankara</option>
            <option>Antalya</option>
            <option>Afyonkarahisar</option>
            <option>Ağrı</option>
        </select>
<br><br>
        Doğum yeriniz:<br>
        <select multiple name="dogumyeri">
            <option>İstanbul</option>
            <option>Ankara</option>
            <option>Antalya</option>
            <option>Afyonkarahisar</option>
            <option>Ağrı</option>
        </select>
    </form>
</body>
</html>
