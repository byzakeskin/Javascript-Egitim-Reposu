<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="statue-wrapper">
  <img src="./img/statue.png" alt="" class="bg-statue" />

<svg class="sketch-layer" viewBox="0 0 400 533" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="pastelTexture" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <path class="sk" filter="url(#pastelTexture)" transform="translate(50,30) scale(0.5) rotate(-6)"
        d="M 50 4 L 61 35 L 95 36 L 67 56 L 78 90 L 50 69 L 22 89 L 32 56 L 5 35 L 39 35 Z" />
  <path class="sk" filter="url(#pastelTexture)" transform="translate(330,60) scale(0.4) rotate(10)"
        d="M 50 4 L 61 35 L 95 36 L 67 56 L 78 90 L 50 69 L 22 89 L 32 56 L 5 35 L 39 35 Z" />
  <path class="sk" filter="url(#pastelTexture)" transform="translate(-20,350) scale(0.45) rotate(-12)"
        d="M 50 4 L 61 35 L 95 36 L 67 56 L 78 90 L 50 69 L 22 89 L 32 56 L 5 35 L 39 35 Z" />
  <path class="sk" filter="url(#pastelTexture)" transform="translate(400,400) scale(0.4) rotate(8)"
        d="M 50 4 L 61 35 L 95 36 L 67 56 L 78 90 L 50 69 L 22 89 L 32 56 L 5 35 L 39 35 Z" />
</svg>
</div>

  <header>
    <a class="header-logo" href="index.html">
      <img src="./img/logo.png" alt="Logo" />
    </a>
  </header>

  <div class="page-wrapper">

    <div class="page-content">
      <h1>Welcome!</h1>
      <p>This is your To-Do List.</p>
    </div>

    <div class="main-layout">

      <div class="glass-panel">

        <div class="form-container">
          <input type="text" id="taskInput" placeholder="New task..." />
          <symbol id="water-ripple" viewBox="0 0 100 92">
            <path d="M100 29.3c0 9-4.2 17.2-10.7 22.6L50 91 10.7 52C4.2 46.4 0 38.3 0 29.2 0 13 13 0 29.3 0c8 0 15.3 3.2 20.6 8.5C55.5 3.2 62.8 0 70.8 0 87 0 100 13 100 29.3z" />
            <path d="M100 29.3c0 9-4.2 17.2-10.7 22.6L50 91 10.7 52C4.2 46.4 0 38.3 0 29.2 0 13 13 0 29.3 0c8 0 15.3 3.2 20.6 8.5C55.5 3.2 62.8 0 70.8 0 87 0 100 13 100 29.3z"
                  transform="matrix(0.6 0 0 0.6 20 18.4)" fill="hsla(0, 0%, 100%, 0.3)" />
            <path d="M100 29.3c0 9-4.2 17.2-10.7 22.6L50 91 10.7 52C4.2 46.4 0 38.3 0 29.2 0 13 13 0 29.3 0c8 0 15.3 3.2 20.6 8.5C55.5 3.2 62.8 0 70.8 0 87 0 100 13 100 29.3z"
                  transform="matrix(0.3 0 0 0.3 35 32.2)" />
          </symbol>
          <button onclick="addTask()">Add</button>
          
        </div>

        <div class="list-container">
          <ul id="taskList">
            <li>
              <span class="task-text" onclick="completeTask(this)">Learn HTML/CSS</span>
              <button class="delete-btn" onclick="deleteTask(this)">Delete</button>
            </li>
          </ul>
        </div>

      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
